# Build with uv and publish to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (no token needed); configure the trusted
# publisher on PyPI and create a "pypi" environment in this repo.
# See: https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for PyPI Trusted Publishing

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build
        run: uv build --no-sources

      - name: Publish to PyPI
        run: uv publish
